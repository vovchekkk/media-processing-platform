syntax = "proto3";

package task;
option go_package = "media-processing-platform/pkg/proto;task";

import "google/protobuf/struct.proto";

message Filter {
  string name = 1;
  google.protobuf.Struct parameters = 2;
}

message TaskMessage {
  string id = 1;
  string image = 2;
  Filter filter = 3;
}