# config/local.yaml

env: "local"
storage_path: "./repository/postgres/postgres.db"
http_server:
  host: "0.0.0.0"
  port: 8000
  timeout: 3s
  idle_timeout: 30s
db:
  host: "localhost"
  user: "user"
  password: "password"
  dbname: "postgres"
  port: "5433"
  sslmode: "disable"
rabbitmq:
  host: "localhost"
  port: "5672"
  user: "guest"
  password: "guest"
  queue_name: "task_queue"
  connection:
    initial_backoff: 1s
    max_retries: 5
    reconnect_interval: 2s